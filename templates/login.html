<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BuildSense AI Orchestrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #0d122b 0%, #080a13 100%);
        }
        .login-card {
            width: 400px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }
        .login-header {
            margin-bottom: 30px;
        }
        .login-header .logo-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: inline-block;
        }
        .login-header h1 {
            font-family: var(--font-heading);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            transition: var(--transition-smooth);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--color-blue);
            background: rgba(0, 210, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
        }
        .error-message {
            color: var(--color-red);
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
        .login-link {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .login-link a {
            color: var(--color-blue);
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="glass-card login-card">
        <div class="login-header">
            <i class="fa-solid fa-cube logo-icon"></i>
            <h1>BuildSense</h1>
            <p>AI Agent Coordination Engine</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-login">
                <span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
            <div id="errorMessage" class="error-message">Invalid credentials</div>
        </form>

        <div class="login-link">
            Don't have an account? <a href="/register">Create Account</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('.btn-login');
            const errorDiv = document.getElementById('errorMessage');
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            btn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = 'Invalid username or password';
                }
            } catch (err) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Connection error';
            } finally {
                btn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
